name: Release

on:
  push:
    tags:
      - "v[0-9]+.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lld clang pkg-config libasound2-dev

      - name: Setup Cargo Env (aarch64 gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          cat <<EOF >> .cargo/config.toml
          [env]
          PKG_CONFIG_ALLOW_CROSS = "1"
          PKG_CONFIG_PATH = "/usr/lib/aarch64-linux-gnu/pkgconfig"
          EOF

      - name: Install cross
        if: matrix.use-cross
        run: cargo install cross --locked

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use-cross
        run: |
          RUSTFLAGS="" cross build --locked --release --target ${{ matrix.target }}

      - name: Build (cargo)
        if: ${{ !matrix.use-cross }}
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../boxpigma-${{ matrix.target }}.tar.gz boxpigma boxpigma-gui
          cd -

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: boxpigma-${{ matrix.target }}
          path: boxpigma-${{ matrix.target }}.tar.gz

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          git-cliff --latest --tag "$VERSION" -o release-notes.md

      - name: Checksums
        # One file the installer scripts can verify against, and the answer to "did my
        # download arrive intact" without asking anyone to copy a hash out of the release
        # page. Names are bare (the assets sit at the release root), sorted so the file
        # itself is reproducible.
        run: |
          cd artifacts
          find . -type f -name 'boxpigma-*.tar.gz' -exec sha256sum {} + \
            | sed -E 's|^([0-9a-f]{64})  \./[^/]+/|\1  |' \
            | sort -k2 \
            > SHA256SUMS
          cat SHA256SUMS

      - name: Generate native update manifest
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path

          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          version = tag.removeprefix("v")
          base = f"https://github.com/{repo}/releases/download/{tag}"

          hashes = {}
          for line in Path("artifacts/SHA256SUMS").read_text().splitlines():
              digest, name = line.split()
              hashes[name] = digest

          platforms = {}
          for archive in Path("artifacts").rglob("boxpigma-*.tar.gz"):
              name = archive.name
              target = name.removeprefix("boxpigma-").removesuffix(".tar.gz")
              if target.startswith("x86_64-"):
                  key = "linux-x86_64"
              elif target.startswith("aarch64-"):
                  key = "linux-aarch64"
              else:
                  continue
              url = f"{base}/{name}"
              platforms[key] = {
                  "url": url,
                  "install_urls": [url],
                  "sha256": hashes[name],
              }

          notes = Path("release-notes.md").read_text()
          manifest = {
              "version": version,
              "notes": notes,
              "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "platforms": platforms,
          }
          Path("artifacts/boxpigma-updates.json").write_text(
              json.dumps(manifest, indent=2) + "\n"
          )
          print(json.dumps(manifest, indent=2))
          PY

      - name: Stage update mirror
        env:
          BOXPIGMA_UPDATE_ROOT: ${{ runner.temp }}/boxpigma-mirror
        run: |
          python3 packaging/stage-release.py \
            --dist artifacts \
            --output "$BOXPIGMA_UPDATE_ROOT" \
            --tag "$GITHUB_REF_NAME"

      - name: Deploy channel mirror
        env:
          BOXPIGMA_DEPLOY_KEY: ${{ secrets.BOXPIGMA_DEPLOY_KEY }}
          BOXPIGMA_DEPLOY_HOST: ${{ secrets.BOXPIGMA_DEPLOY_HOST }}
          FERRISO_DEPLOY_KEY: ${{ secrets.FERRISO_DEPLOY_KEY }}
          FERRISO_DEPLOY_HOST: ${{ secrets.FERRISO_DEPLOY_HOST }}
        run: |
          set -o pipefail
          deploy_key="${BOXPIGMA_DEPLOY_KEY:-$FERRISO_DEPLOY_KEY}"
          deploy_host="${BOXPIGMA_DEPLOY_HOST:-$FERRISO_DEPLOY_HOST}"
          if [[ -z "$deploy_key" || -z "$deploy_host" ]]; then
            echo "deployment secrets are not configured; GitHub fallback remains active"
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$deploy_key" > ~/.ssh/ferriso-deploy
          chmod 600 ~/.ssh/ferriso-deploy
          ssh-keyscan -H "$deploy_host" >> ~/.ssh/known_hosts
          (cd "$RUNNER_TEMP/boxpigma-mirror" && tar -czf - *) \
            | ssh -i ~/.ssh/ferriso-deploy "ferriso-deploy@$deploy_host"

      - name: Upload release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/SHA256SUMS
            artifacts/boxpigma-updates.json
            artifacts/boxpigma-*/boxpigma-*
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
