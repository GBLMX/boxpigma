name: Release

on:
  push:
    tags:
      - "v[0-9]+.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lld clang pkg-config libasound2-dev

      - name: Setup Cargo Env (aarch64 gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          cat <<EOF >> .cargo/config.toml
          [env]
          PKG_CONFIG_ALLOW_CROSS = "1"
          PKG_CONFIG_PATH = "/usr/lib/aarch64-linux-gnu/pkgconfig"
          EOF

      - name: Install cross
        if: matrix.use-cross
        run: cargo install cross --locked

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use-cross
        run: |
          RUSTFLAGS="" cross build --locked --release --target ${{ matrix.target }}

      - name: Build (cargo)
        if: ${{ !matrix.use-cross }}
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../boxpigma-${{ matrix.target }}.tar.gz boxpigma boxpigma-gui
          cd -

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: boxpigma-${{ matrix.target }}
          path: boxpigma-${{ matrix.target }}.tar.gz

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          git-cliff --latest --tag "$VERSION" -o release-notes.md

      - name: Checksums
        # One file the installer scripts can verify against, and the answer to "did my
        # download arrive intact" without asking anyone to copy a hash out of the release
        # page. Names are bare (the assets sit at the release root), sorted so the file
        # itself is reproducible.
        run: |
          cd artifacts
          find . -type f -name 'boxpigma-*.tar.gz' -exec sha256sum {} + \
            | sed -E 's|^([0-9a-f]{64})  \./[^/]+/|\1  |' \
            | sort -k2 \
            > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/SHA256SUMS
            artifacts/boxpigma-*/boxpigma-*
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
