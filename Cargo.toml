[package]
name = "boxpigma"
version = "1.6.3"
edition = "2024"
description = "A netease cloud music client (GBLMX fork)"
repository = "https://github.com/GBLMX/pigma"
license = "Apache-2.0"
# `authors` 已按 Cargo 官方文档弃用（"Warning: This field is deprecated"），
# 且没有任何代码读取 CARGO_PKG_AUTHORS（无 clap crate_authors!()）。
# 署名见 README 的「上游 / 本仓库」一节与 LICENSE。

[workspace]
# First-party crates live in one workspace so a single lockfile resolves them and
# `cargo test/clippy --workspace` actually covers them (see .github/workflows/ci.yml).
members = ["crates/ncm-api"]
resolver = "3"

# Versions shared by more than one crate. Members pull these in with
# `{ workspace = true }` and may add features; this keeps one version of each
# dependency in the lockfile instead of drifting per crate (rustls used to be
# specified as 0.23, 0.23.32 and 0.23.43 in three different manifests).
[workspace.dependencies]
base64 = "0.23.1"
log = "0.4.33"
md-5 = "0.11.0"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["rt", "sync", "time"] }
url = "2.5.8"

[dependencies]
audioadapter = "5.0.0"
audioadapter-buffers = "5.2.0"
base64 = { workspace = true }
biquad = "0.6.0"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
ebur128 = "0.1.10"
# `boxpigma update` unpacks the release archive itself (see src/update.rs); the rust backend
# keeps that pure Rust, so no C toolchain is needed to build.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
futures = { version = "0.3.33", default-features = false, features = ["async-await", "std"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
# `SIGPIPE` handling (src/cli.rs): Rust ignores the signal, so the CLI restores the default.
libc = "0.2.189"
lofty = "0.25.0"
log = { workspace = true, features = ["serde", "std"] }
ncm-api = { path = "crates/ncm-api" }
palette = "0.7.7"
qrcode = "0.14.1"
rand = "0.10.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache", "serde"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
reqwest = { workspace = true }
# rodio = { version = "0.22.2", default-features = false, features = ["flac", "mp3", "mp4", "playback", "vorbis", "wav"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-aac", "symphonia-flac", "symphonia-isomp4", "symphonia-mp3", "symphonia-vorbis", "symphonia-wav"] }
rubato = "5.0.0"
rustls = { workspace = true }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
# Verifying the downloaded release against the published `SHA256SUMS` (src/update.rs).
sha2 = "0.11.0"
stream-download = { version = "0.24.4", default-features = false, features = ["async-read", "reqwest", "temp-storage"] }
# Release archives are `boxpigma-<target>.tar.gz` (see .github/workflows/release.yml); the
# updater unpacks them itself.
tar = "0.4.46"
thiserror = { workspace = true }
time = { workspace = true, features = ["formatting", "local-offset", "macros"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal"] }
toml_edit = { version = "0.25.13", features = ["serde"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "local-time", "tracing-log"] }
unicode-width = "0.2.2"
url = { workspace = true }
zbus = { version = "5.19.0", features = ["tokio"] }
# dhat = "0.3.3"

[dev-dependencies]
rustls = { workspace = true }


# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
opt-level = 3
# opt-level = "s"
strip = true
lto = true
panic = "abort"
codegen-units = 1

# [features]
# default = ["vorbis"]
# vorbis = ["rodio/vorbis"]
