# =============================================================================
# 键位：把命令换到别的键上
#
# 键位表由命令表派生——每个命令默认的键写在 `:help` 与命令面板里，这里只写“要改的那些”。
# 值是**一个字符**；写空串表示解绑（该命令只留 `:` 行与命令面板，不再占按键）。
# 改完存盘即生效（`:save` 或任意一次设置改动都会写回）。
#
# 名字就是命令名（即 `:` 后那一段，可 Tab 补全）。值可以是一个键，也可以是一串键（空格分隔的
# 多键序列，像 vim 的 `g g`：先按下的键会等后续按键，Esc 放弃；`ctrl+w` / `alt+x` 也能写）。
# 例子：
# [keys]
# visualizer = "w"        # 频谱开关从 v 换到 w（v 随即空出来）
# spin = "z z"            # 封面旋转改成两下 z（z 原本是 navpos，会被这条遮住）
# lyrics = "ctrl+l"       # 歌词页从 l 换成 Ctrl+L
# queue = ""              # 解绑：该命令只留 `:` 行与命令面板

# =============================================================================

# boxpigma 配置文件示例
# 配置文件路径: ~/.config/boxpigma/config.toml
# 未配置的字段会使用默认值
# =============================================================================

# 配置文件的 schema 版本；旧文件缺少该字段时按 0 处理，加载时自动升级：先备份原文件，再当场重写
config_version = 2

# 默认主题名称 (对应 themes 中定义的 name); 也可写 "random": 每次启动随机挑一个
# (:theme random 则立刻重掷一次, 并把抽到的那一个写回配置)
default_theme = "default"

# 快进/快退间隔 (秒)
seek_interval_secs = 15

# 搜索结果数量限制
search_limit = 100

# 导航栏位置: "left" (左侧, 默认), "right" (右侧), "top" (顶部) 或 "bottom" (底部)
navigation_position = "left"

# 启动 splash 界面最短显示时长 (秒), 启动流程的进度条会按此时长播放动画,
splash_duration_secs = 2.0

# `boxpigma status` 的 plain 输出模板, 可用占位符:
#   {current}/{position} {duration} {artist} {name} {album} {volume} {status} {mode} {id} {liked}
cli_status_template = "{name}  {artist}  {current}/{duration}  {status}  vol {volume}%"

# `boxpigma status` 默认输出格式: "plain" 或 "json"
cli_status_format = "plain"

# 是否捕获鼠标。捕获后可以点击播放栏控件、列表行、标签页；关掉则把终端自身的
# "拖选 + 复制"还给鼠标（大多数终端里按住 Shift 拖选可临时绕过，不必改这里）
mouse = true

# 输入框里的光标形状: "default"(跟随终端) / "block" / "underline" / "bar"
cursor_style = "default"

# 歌词渐变效果: "rainbow", "fire", "ocean", "forest", "sunset", "neon", "pastel", "monochrome"
lyric_gradient = "rainbow"

# 歌词显示样式:
#   "window"   —— 滚动窗口(默认):当前行上下若干行 + 卡拉OK填充
#   "one_line" —— 一次一行:只显示当前行、居中(也接受 "single")
#   "ktv"      —— 同上滚动窗口,但填充是单色而不是渐变,即 KTV 字幕机的样子(也接受 "karaoke")
#   "flow"     —— 颜色流动:渐变沿文字流动,快慢跟着当前这句唱多久,上下行用同色系渐隐
#   "plain"    —— 纯滚动列表,无高亮
# 也可在应用里 `:lyrics <样式>` 切换(输入时 Tab 可补全,裸调用轮流切换)
lyric_style = "window"

# `ktv` 样式的填充色: 主题字段(accent/text/muted/border/error/...),或颜色本身(blue、lightblue、#4da6ff、ANSI 序号)
lyric_ktv_color = "#4da6ff"

# 原文下面是否再画一行译文(英文歌的中文翻译等),译文行前会带一个标记以示区别
# 也可用 `y` 键或 `:translation on|off` 当场开关
lyric_translation = true

# 代理地址, 支持 http:// https:// socks5://
# 所有网络请求都走它 —— 网易云 API、封面下载、音频流
# 海外用户: 取消注释并填上代理地址 (NCM 走代理)
# 国内用户: 保持注释 (直连)
# proxy = "http://127.0.0.1:7890"

# 桌面通知（默认关闭）。用 OSC 9 触发，kitty / WezTerm / foot 支持
[notify]
# 切歌时通知当前曲目（歌名 — 歌手）
song_change = false
# 播放出错时通知
errors = false

# =============================================================================
# 缓存配置
# =============================================================================
[cache]
# 内容缓存过期时间 (秒), 0 表示不缓存
content_cache_ttl = 300
# 音质: "standard", "higher", "exhigh", "lossless", "hires", "jyeffect", "sky", "jymaster"
quality = "standard"
# 下载缓存目录 (相对于缓存目录或绝对路径)
# 默认：~/.cache/boxpigma/downloads
cache_dir = "downloads"
# 缓存文件命名模板, 可用变量: {id}, {name}, {singer}, {album}
cache_template = "{name}-{singer}"
# 边听边存: 播放时自动写入下载缓存, false 则只流式播放、不落盘
save_on_play = true

# =============================================================================
# 音频处理链 (解码后 → 设备前)
# =============================================================================
[audio]
# 设备采样率与文件不一致时, 用 rubato 做重采样而不是交给音频后端
# (后端重采样是为了让流不断, 不是为了保住录音; 采样率一致时不会经过任何处理 = 位完美)
resample = true

# 参量均衡 (可选, 可多段; 不写就是平直响应)
# freq: 中心频率 Hz; gain_db: 提升/衰减 dB; q: 带宽 (默认 1.0, 越大越窄)
# [[audio.eq]]
# freq = 105.0
# gain_db = -3.0
# q = 1.0

# 响度归一化 (EBU R128, 可选), 让安静与响亮的曲子落在同一档
# target_lufs: 目标响度 (-14 接近流媒体, -23 是广播)
# max_gain_db: 提升上限, 避免把底噪也抬起来
# [audio.loudness]
# target_lufs = -14.0
# max_gain_db = 12.0

# =============================================================================
# 面板尺寸
# =============================================================================
# 外框（最外层框架）不动；动的是框内的面板。鼠标拖面板内边界改尺寸，
# 双击同一条边界把该面板折叠掉、再双击还原（尺寸会记住）。
# 键盘：Ctrl+↑/↓ 拖顶栏/播放条的边界，Ctrl+←/→ 拖侧栏边界（每次 2 格）。
# 也可用 `:pane <面板> [on|off|toggle]`（面板: topbar / navigation / playerbar / mv，Tab 可补全）。
[panes]
# 顶栏行数
topbar = 3
# 导航栏尺寸: 左右两侧时是列宽(列)，上下时固定 3 行(横条高度由条目决定)
navigation = 26
# 播放条行数；启用频谱时至少需要 6 行（边框内 4 行：标题、进度、控制、频谱）
playerbar = 6
# 歌词页 MV 海报栏列宽，0 表示按海报自动
mv = 0
# 折叠掉的面板（尺寸保留，还原时原样回来）
# collapsed = ["topbar"]

# =============================================================================
# 边框配置
# =============================================================================
[border]
# 是否显示边框
enabled = true
# 是否使用圆角边框
rounded = false
# 边框颜色是否跟随角落颜色
follow_corner_color = false
# 边框渐变效果名称，同歌词渐变名称 (可选, 不设置则无渐变)，优先级最高
border_gradient = "rainbow"
# 边框渐变速度 (每秒变化量, 0 表示静态)
border_gradient_speed = 0.005

# =============================================================================
# 播放器栏配置
# =============================================================================
[playerbar]
# 播放栏布局: "default", "modern", "minimal"
# modern 仅有封面
layout = "modern"

# 进度条样式: "thick"(粗线实心,默认) / "segment"(斜线分段 + 彩虹渐变) / "line"(细线 + 主题渐变)
#             "blocks"(方块 + turbo 渐变) / "plain"(单字形,无渐变)
# 也可在应用里 `:progress <样式>` 切换(裸调用轮流切换, Tab 可补全)
progress_style = "thick"

# 下面三行覆盖样式给出的默认值: 不设置即用样式的符号
# 进度条填充符号
filled_symbol = "━"
# 进度条未填充符号
unfilled_symbol = "─"
# 进度条填充颜色 (颜色名或 hex)
filled_color = "accent"
# 进度条未填充颜色
unfilled_color = "text"
# 已缓存到本地时进度条轨道颜色
unfilled_color_cached = "warning"
# 进度条渐变: 不设置 = 跟随 progress_style; 设为空串 = 强制关闭渐变; 写预设名 = 强制该渐变
# 可选: "warm", "cubehelix", "rainbow", "turbo", "spectral", "viridis"
gradient_preset = ""

# 播放时封面缓慢旋转（黑胶唱片）。20 秒一圈、每圈 72 个角度，即约 0.28 秒换一个角度、
# 每步把封面重编码一次（约 3.6 次/秒；角度不变的那些帧复用已有协议，不重编码）。
# 暂停或停止时停在当前角度；不旋转时（默认）封面一切照旧。
# 不带图形协议的终端（halfblocks 回退）不重编码：改为转动占位字形 ◴◵◶◷，
# 并在右上角画唱针（播放 ╲ 落在盘上、暂停 │ 抬起）——图形协议把图片画在字符层之上，
# 图像模式下画不了唱针，所以那里只转盘。
spinning_cover = false

# 封面用什么协议画。"auto" 先问终端、按终端的回答决定，只在该终端不回话时才看环境变量；
# 自动模式还会避开 tmux（图形不一定透传，猜错会画花界面）与已知"答得比画得好"的终端
# （WezTerm / Rio / iTerm2 会应答 kitty 查询，但只有 iTerm2 协议在那里无 bug）。
#
# herdr 是另一回事：窗格里的终端由 herdr 自己仿真，它只解析 kitty 图形协议、再自己画到外层
# 终端，而窗格里的进程仍然带着**外层**终端的 TERM_PROGRAM。所以在 herdr 窗格里一律用 kitty
# 协议，据 `HERDR_ENV` 判定，先于上面那条 WezTerm 修正。
#
# tuios 是同一类，只是更绕：它的窗格也不问终端——它把图形查询答成 `CSI ? 0 n`（`CSI 5 n` 的
# 标准回复是 `CSI 0 n`，`ratatui-image` 读不出前者），查询线程会一直卡在 read() 上；格子尺寸
# 改从窗格自己的 pty 拿（tuios 把客户端的格子尺寸写进 pty 的像素字段，但晚约 0.3 秒才写）。
# 同样据环境变量判定（`TUIOS_ENV`），也先于上面那条 WezTerm 修正。
#
#   "auto"       —— 问终端（推荐）
#   "kitty"      —— kitty 图形协议（kitty 0.28+ / ghostty / herdr 与 tuios 窗格等）
#   "iterm2"     —— iTerm2 内联图片协议（WezTerm / Rio / iTerm2）
#   "sixel"      —— 六像素图（foot / mlterm / xterm -ti 340 ...）
#   "halfblocks" —— 不用图形协议，用半块字符画（任何终端都能看）
#
# 在 tmux 里开了 allow-passthrough，或自动判断不合心意时，直接写死即可。
image_protocol = "auto"

# 播放栏各组件可见性(建议暂时别用，音量控制没写好)
[playerbar.visible]
# 是否显示封面
cover = true
# 是否显示音量控制
volume = true
# 是否显示播放模式图标
mode_icon = true
# 是否显示加载动画
spinner = true

# =============================================================================
# 标题配置 (支持 {count} 变量)
# =============================================================================
[titles]
sidebar = " NAVIGATION"
playlist = "♪ QUEUE ({count})"
lyrics = "♪ LYRICS"

# =============================================================================
# 日志配置
# =============================================================================
[logger]
# 日志级别: "error", "warn", "info", "debug", "trace"
log_level = "debug"

# =============================================================================
# 自定义主题
# =============================================================================
# 颜色格式: hex (#rrggbb)、名字 (red, blue, ...)、或索引 (0-255, 也可直接写整数)
# base 是起点: 内置主题名, 或另一个自定义主题; 不写则用 default
# 只需写想改的颜色, 其余沿用 base
#
# [themes.my_theme]
# base = "tokyo-night"
# bg = "#0a0b10"
# surface = "#1a1a2e"
# text = "#ff0066"
# accent = "#ffcc00"
# muted = "#00f0ff"
# border = 3
# error = "#b000ff"
#
# 然后 default_theme = "my_theme", 或在应用里 `:theme my_theme` (Tab 可补全)
#
# 除了一组基础色, 还能按**组件**细化: 每个节里的一项是一个「样式」——{ fg, bg, bold, italic,
# underline, reversed, dim }, fg/bg 可以写主题字段名(bg/surface/text/accent/muted/border/
# error/warn) 或颜色本身。没写的部分沿用该组件的默认样式(由基础色推出), 所以只写想改的一项。
#
# [themes.my_theme.table]
# header    = { fg = "accent", bold = true }          # 表头
# row       = { fg = "text" }                          # 普通行
# selected  = { fg = "on_accent", bg = "accent" }      # 选中行(on_accent = 压在强调色上可读的前景)
# secondary = { fg = "muted", dim = true }             # 次要列(专辑/时长)
# playing   = { fg = "accent", bold = true }           # 正在播放的那一行
#
# [themes.my_theme.tabs]      # 队列标签: active / inactive
# [themes.my_theme.lyrics]    # 歌词: line / sung / translation
# [themes.my_theme.popup]     # 弹层: border / title / footer
# [themes.my_theme.notify]    # 通知分级: info / warn / error
# 顶层还可写 warn = "#e5c07b"(警示色, 通知的 warn 级用它)
#
# 这些节与键都由同目录的 `theme.schema.json` 描述(JSON Schema), 编辑器装上 TOML 插件后
# 可以按它校验与补全。字形(箭头/标记/图标)不在主题里: 见 [symbols] —— 一处定义, 预设切换。

# =============================================================================
# 自定义列定义
# =============================================================================
# [columns]
# songs 列表页列定义
# header = 显示名称, field = 数据字段名
# width: 固定宽度 (可选)
# min_width: 最小宽度 (可选)
# ratio: 比例 (可选, 格式 [分子, 分母])
#
# [columns.songs]
# songs = [
#   { header = "TITLE", field = "name", ratio = [3, 8] },
#   { header = "ARTIST", field = "singer", ratio = [2, 8] },
#   { header = "ALBUM", field = "album", ratio = [2, 8] },
#   { header = "DURATION", field = "duration", width = 10 },
# ]
#
# [columns.songlist]
# songlist = [
#   { header = "NAME", field = "name", ratio = [3, 4] },
#   { header = "AUTHOR", field = "singer", ratio = [1, 4] },
# ]
#
# 自定义页面列覆盖
# [columns.overrides]
# toplist = [
#   { header = "RANK", field = "index", width = 6 },
#   { header = "SONG", field = "name" },
# ]
# hotsearch = [
#   { header = "#", field = "index", width = 4 },
#   { header = "KEYWORD", field = "name" },
# ]

# =============================================================================
# 导航栏配置
# =============================================================================
# [navigation]
# [[navigation.sections]]
# title = "DISCOVER"
# [[navigation.sections.items]]
# name = "Daily Recommend"
# api = "recommend_songs"
# title_template = "Daily Recommend"  # 可选, 用于面包屑显示
#
# [[navigation.sections.items]]
# name = "Top Lists"
# api = "toplist"
#
# [[navigation.sections]]
# title = "MY MUSIC"
# [[navigation.sections.items]]
# name = "Liked"
# api = "user_playlist_like"

# =============================================================================
# 更新通道
# =============================================================================
# stable：只接收正式版；beta：正式版 + beta；alpha：全部。
# 也可以用 `boxpigma update --channel <stable|beta|alpha>` 或环境变量
# BOXPIGMA_UPDATE_CHANNEL 临时覆盖。
[update]
channel = "stable"
